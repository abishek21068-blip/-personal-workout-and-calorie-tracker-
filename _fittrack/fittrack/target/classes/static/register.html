<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>FitTrack - Create Account</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background: #101319;
            color: white;
            min-height: 100vh;

            display: flex;
            justify-content: center;
            align-items: center;

            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 500px;

            background: #181c24;
            padding: 30px;

            border-radius: 15px;
            border: 1px solid #292d38;

            box-shadow: 0 10px 30px rgba(0,0,0,0.4);
        }

        h1 {
            text-align: center;
            margin-bottom: 10px;
            color: #22c55e;
        }

        .subtitle {
            text-align: center;
            color: #8f96a3;
            margin-bottom: 25px;
        }

        .form-group {
            margin-bottom: 16px;
        }

        label {
            display: block;
            margin-bottom: 7px;
            font-size: 14px;
        }

        input,
        select {
            width: 100%;
            padding: 12px;

            background: #101319;
            color: white;

            border: 1px solid #353b48;
            border-radius: 8px;

            outline: none;
        }

        input:focus,
        select:focus {
            border-color: #22c55e;
        }

        button {
            width: 100%;
            padding: 13px;

            background: #22c55e;
            color: white;

            border: none;
            border-radius: 8px;

            font-size: 16px;
            font-weight: bold;

            cursor: pointer;
            margin-top: 10px;
        }

        button:hover {
            background: #16a34a;
        }

        .login-link {
            text-align: center;
            margin-top: 20px;
            color: #8f96a3;
        }

        .login-link a {
            color: #22c55e;
            text-decoration: none;
        }

        .message {
            text-align: center;
            margin-top: 15px;
            font-size: 14px;
        }

        .success {
            color: #22c55e;
        }

        .error {
            color: #ef4444;
        }
    </style>
</head>

<body>

<div class="container">

    <h1>FitTrack</h1>

    <p class="subtitle">
        Create your account
    </p>

    <form id="registerForm">

        <!-- Name -->
        <div class="form-group">
            <label for="name">Full Name</label>

            <input
                    type="text"
                    id="name"
                    placeholder="Enter your name"
                    required
            >
        </div>

        <!-- Email -->
        <div class="form-group">
            <label for="email">Email</label>

            <input
                    type="email"
                    id="email"
                    placeholder="Enter your email"
                    required
            >
        </div>

        <!-- Password -->
        <div class="form-group">
            <label for="password">Password</label>

            <input
                    type="password"
                    id="password"
                    placeholder="Enter your password"
                    required
            >
        </div>

        <!-- Age -->
        <div class="form-group">
            <label for="age">Age</label>

            <input
                    type="number"
                    id="age"
                    placeholder="Enter your age"
                    min="1"
                    max="120"
                    required
            >
        </div>

        <!-- Gender -->
        <div class="form-group">
            <label for="gender">Gender</label>

            <select id="gender" required>
                <option value="">Select Gender</option>
                <option value="Male">Male</option>
                <option value="Female">Female</option>
                <option value="Other">Other</option>
            </select>
        </div>

        <!-- Height -->
        <div class="form-group">
            <label for="height">Height (cm)</label>

            <input
                    type="number"
                    id="height"
                    placeholder="Enter height"
                    step="0.1"
                    min="1"
                    required
            >
        </div>

        <!-- Weight -->
        <div class="form-group">
            <label for="weight">Weight (kg)</label>

            <input
                    type="number"
                    id="weight"
                    placeholder="Enter weight"
                    step="0.1"
                    min="1"
                    required
            >
        </div>

        <!-- Activity -->
        <div class="form-group">
            <label for="activityLevel">Activity Level</label>

            <select id="activityLevel" required>
                <option value="">Select Activity Level</option>
                <option value="Low">Low</option>
                <option value="Moderate">Moderate</option>
                <option value="High">High</option>
            </select>
        </div>

        <button type="submit">
            Create Account
        </button>

    </form>

    <div id="message" class="message"></div>

    <div class="login-link">
        Already have an account?
        <a href="index.html">Login</a>
    </div>

</div>

<!-- IMPORTANT -->
<script src="js/register.js"></script>

</body>
</html>
